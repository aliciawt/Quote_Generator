<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Generator App</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="quotes.js"></script>
  </head>
  <body>
    <div id="qotd">
      <h1>Quote of the Day</h1>
      <p id="quote"></p>
      <p id="author"></p>
      <button type="button" id="new-quote">New quote</button>
    </div>
    <div id="add-quote-form">
      <h3>Add your own quote</h3>
      <input type="text" id="new-quote-text" placeholder="Enter the quote" />
      <input type="text" id="new-quote-author" placeholder="Author name" />
      <button id="submit-quote-btn">Submit Quote</button>
      <p id="form-message"></p>
    </div>
  </body>
</html>
